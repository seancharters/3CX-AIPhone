; SIP: register with 3CX as an ordinary extension.

[global]
type=global
user_agent=AI-Triage-Agent

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Lets a settings change (e.g. public IP) apply on reload without restarting Asterisk.
allow_reload=yes
; Asterisk runs behind NAT (Docker and/or cloud). Advertise the public IP in SIP/SDP.
#include pjsip_nat.conf.inc
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; 3CX registration/endpoint (only once the extension is configured in the admin UI).
#include pjsip_3cx.conf.inc

; Optional local softphone for testing (only when TEST_SIP_PASSWORD is set).
#include pjsip_tester.conf.inc
