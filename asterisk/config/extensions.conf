[general]
static=yes
writeprotect=yes

; Calls 3CX sends to our extension.
[from-3cx]
exten => _[0-9a-zA-Z+*#].,1,Goto(ai-agent,s,1)
exten => s,1,Goto(ai-agent,s,1)

; Test softphone: dial 800.
[from-tester]
exten => 800,1,Goto(ai-agent,s,1)

; Hand the call to the Python agent over a media WebSocket (see websocket_client.conf).
[ai-agent]
exten => s,1,NoOp(AI triage call from ${CALLERID(all)})
 same => n,Answer()
 same => n,Dial(WebSocket/agent/c(slin16)f(json)v(caller_num=${URIENCODE(${CALLERID(num)})},caller_name=${URIENCODE(${CALLERID(name)})},channel=${URIENCODE(${CHANNEL})},codec=${FILTER(a-z0-9,${CHANNEL(audionativeformat)})}))
 same => n,Hangup()

; The agent redirects the caller here (via AMI) to reach a human. ${EXTEN} is the 3CX target.
[agent-transfer]
exten => _X.,1,NoOp(Transferring ${CHANNEL} to ${EXTEN})
 ; Blind transfer via SIP REFER, as a desk phone would, so the call leaves Asterisk.
 same => n,GotoIf($["${CHANNEL(channeltype)}" != "PJSIP"]?dial)
 same => n,GotoIf($["${CHANNEL(endpoint)}" != "threecx"]?dial)
 same => n,Transfer(PJSIP/sip:${EXTEN}@${THREECX_HOST})
 same => n,GotoIf($["${TRANSFERSTATUS}" = "SUCCESS"]?done)
 ; Fallback: call the target through 3CX and bridge the caller to it.
 same => n(dial),Dial(PJSIP/${EXTEN}@threecx,60)
 same => n(done),Hangup()
